name: Daily mandate scan

# Disabled (no `schedule` trigger) — the whole bot now runs locally via
# launchd (run_local_only.sh, all nine sources) instead of split across
# GitHub Actions + local, since two sources are unreachable from GitHub's
# runners. Kept as workflow_dispatch for manual/occasional use — re-add a
# `schedule:` block here to bring cloud scheduling back if that ever makes
# sense again (e.g. a self-hosted runner with a Pakistani IP).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run mandate bot
        # Punjab and BPPT time out completely from GitHub-hosted runners'
        # IP ranges (net::ERR_CONNECTION_TIMED_OUT — the TCP connection
        # itself never completes, confirmed 2026-08-24 even after
        # generously raising the navigation timeout), while working fine
        # from a normal/local network. Both run separately via a scheduled
        # local launchd job instead (see run_local_only.sh) and share this
        # same state/seen.json through git, so nothing is scanned twice.
        run: python3 -m mandate_bot.main --exclude punjab,bppt

      - name: Sync results to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 sync_to_supabase.py

      - name: Persist dedupe state
        run: |
          git config user.name "mandate-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "Update seen-tender state [skip ci]"
          git push
