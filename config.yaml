# Mandate Bot configuration

source:
  base_url: "https://eproc.punjab.gov.pk/"
  listing_path: "ActiveTenders.aspx"
  # This portal's TLS cert was expired when the bot was first built
  # (2026-08-15) but has since been properly reissued (verified 2026-08-18,
  # valid DigiCert cert through Mar 2027) — verification is back on. If it
  # ever regresses, flip this to true as a temporary workaround.
  insecure_skip_verify: false
  max_pages: 20        # safety cap on grid pages to walk
  request_delay_seconds: 1.5   # be polite to the server

# Only rows whose "Type" column matches one of these are downloaded/scanned.
# Punjab eProc lumps legal services under "Services" (and sometimes "Consultancy"),
# there is no dedicated "Legal" category, hence the keyword pass below.
categories:
  - "Services"
  - "Consultancy"

# Case-insensitive keyword match against the extracted PDF text.
# A tender is considered a match if ANY keyword is found in EITHER the
# bidding document or the tender notice PDF.
keywords:
  - "legal services"
  - "legal advisor"
  - "legal advisory"
  - "legal consultant"
  - "legal counsel"
  - "legal opinion"
  - "law firm"
  - "panel of advocates"
  - "advocate general"
  - "advocate on record"
  - "legal retainer"
  - "panel of lawyers"
  - "legal representation"
  - "engagement of legal"
  - "hiring of legal"
  - "empanelment of legal"
  - "empanelment of advocates"
  - "empanelment of law"

# Keywords in this list are boilerplate false-positive traps seen in nearly
# every bidding document on this portal (dispute-resolution clauses, "Power
# of Attorney" signatory requirements) and were deliberately excluded even
# though they sound legal-related: "attorney", "litigation", "arbitration".
# The same list above is reused for the bppt source below.

# Balochistan Public Procurement Regulatory Authority (BPPRA) portal.
# A Blazor Server app: pagination and category filters run over a live
# WebSocket connection, so this source is scraped with a headless browser
# (Playwright) instead of plain HTTP requests. Its "documents" are rendered
# report pages, not real PDFs, so text is extracted by rendering them and a
# PDF snapshot is printed (page.pdf()) as the saved artifact.
bppt:
  enabled: true
  base_url: "https://bpptwo.vdc.services:5451/"
  listing_path: "Tenders"
  # Category filter buttons on the site's toolbar. "Consulting Services"
  # currently returns 0 active tenders but is kept in case that changes.
  categories:
    - "Services"
    - "Consulting Services"
  # Services alone has ~1400 entries across ~150+ pages at this site's
  # variable page size (4-10 rows/page observed) — set well above that so a
  # full run doesn't quietly truncate. The "page repeated" stuck-page check
  # in bppt.py still stops early once a category is genuinely exhausted.
  max_pages: 250                # safety cap on grid pages to walk, per category
  request_delay_seconds: 1.0   # be polite to the server

# Khyber Pakhtunkhwa Public Procurement Regulatory Authority (KPPRA) portal.
# Classic server-rendered PHP with query-string pagination, no browser
# needed. Category isn't shown in the listing table, only via a small AJAX
# JSON endpoint called once per tender to classify it. Documents are a mix
# of real PDFs and photographed/scanned JPGs of physical notices; both are
# OCR'd as needed (see kppra.py).
kppra:
  enabled: true
  base_url: "http://www.kppra.gov.pk/kppra/"
  listing_path: "activetenders.php"
  categories:
    - "Consulting Services"
    - "NON-Consulting Services"
  max_pages: 20
  request_delay_seconds: 0.5

# Federal PPRA e-Publish & Monitoring System (epms.ppra.gov.pk) — Pakistan's
# national procurement portal. Classic server-rendered pages, plain-requests
# scrapeable, and (unlike KPPRA) its category filter actually works
# server-side, so only real candidates get fetched instead of every tender.
epms:
  enabled: true
  base_url: "https://epms.ppra.gov.pk/"
  listing_path: "public/tenders/active-tenders"
  categories:
    - "Consultancy Services"
    - "Non-consultancy Services"
  max_pages: 20
  request_delay_seconds: 0.5

# Sindh Public Procurement Regulatory Authority portal (ppms.pprasindh.gov.pk)
# A JSF/PrimeFaces app — every document download is a stateful form POST,
# not a plain link, so this source uses Playwright (like BPPT). No
# procurement-category taxonomy is exposed, so all Active-status tenders are
# scanned (only ~4 of ~2800 total tenders are Active at any given time — the
# rest are Archived/Cancelled history, so this stays a small, fast source).
# This portal's TLS cert is missing its intermediate chain (browser reports
# "unable to get local issuer certificate") — handled the same way as BPPT,
# via Playwright's ignore_https_errors, no config flag needed here.
sindh:
  enabled: true
  base_url: "https://ppms.pprasindh.gov.pk/"
  listing_path: "PPMS/public/portal/notice-inviting-tender"
  max_pages: 10
  request_delay_seconds: 1.0
  # A single NIT can bundle many procurement items, each needing its own
  # sequential download (one real tender had 86) — cap how many bidding
  # documents get downloaded per tender so an outlier can't stall a run for
  # 20+ minutes. The NIT Notice itself is always downloaded regardless.
  max_bidding_docs_per_tender: 15

# KP Planning & Development Department tenders page (pndkp.gov.pk/tenders/)
# A WordPress site (WP Download Manager plugin) — the simplest source yet:
# title + a directly downloadable file URL are both right in the listing
# page, no detail-page visit needed, no real pagination (~39 tenders,
# entirely on one page), valid TLS cert. No department/category/closing-date
# metadata is exposed (generic file library, not a purpose-built portal), so
# every listed file is scanned directly via the keyword pass.
pndkp:
  enabled: true
  base_url: "https://pndkp.gov.pk/"
  listing_path: "tenders/"
  max_pages: 5
  request_delay_seconds: 1.0

# Asian Development Bank Consultant Management System (selfservice.adb.org)
# International-tier consulting opportunities (loans/grants/TA projects
# across ADB member countries) — a different tier from the domestic
# Pakistani portals. Despite being a "self service" (login-capable) portal,
# searching, viewing full opportunity details, and downloading Terms of
# Reference documents are all public — login is only needed to actually
# submit a bid ("Express Interest"), which this bot never does. Credentials
# were provided but are intentionally unused — see secrets.yaml.
#
# The site's own "Search by Expertise" field only searches its Expertise
# tag (not free text), so search_terms here should stay short/generic
# rather than full phrases — the usual keywords list below is still applied
# afterward against each opportunity's downloaded Terms of Reference.
adb:
  enabled: true
  search_terms:
    - "legal"
    - "law"

# World Bank Procurement Notices (projects.worldbank.org), filtered to
# Pakistan. Backed directly by the site's own JSON API
# (search.worldbank.org/api/v2/procnotices) rather than the Angular
# front-end — its listing response already includes each notice's full
# content as HTML (field `notice_text`), so keyword-matching happens
# straight off the API with no per-candidate page rendering needed.
# "Contract Award" notices (announcing an already-decided winner, not an
# open opportunity) are excluded in worldbank.py. A headless browser is
# only spun up for confirmed matches, to snapshot notice_text as a PDF —
# no network navigation involved at that point, just local HTML-to-PDF.
worldbank:
  enabled: true
  request_delay_seconds: 0.5
  page_size: 100

paths:
  download_dir: "downloads"
  state_file: "state/seen.json"
  match_log: "logs/matches.csv"
  run_log: "logs/run.log"
